services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: nikahyuk
      POSTGRES_PASSWORD: nikahyuk
      POSTGRES_DB: nikahyuk_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nikahyuk -d nikahyuk_test"]
      interval: 2s
      timeout: 3s
      retries: 15
